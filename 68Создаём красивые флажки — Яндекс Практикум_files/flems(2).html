<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кастомные элементы формы</title>
    <link rel="stylesheet" href="./fonts.css">
    <link rel="stylesheet" href="./style(2).css">
  <style id="styles/style.css">* {
  box-sizing: border-box;
}

html,
body {
  height: 100%;
}

body {
  display: flex;
  justify-content: center;
  align-items: center;
  min-width: 650px;
  margin: 0;
  font-family: 'Open Sans', sans-serif;
  font-size: 18px;
  background-image: url(https://code.s3.yandex.net/web-code/images/dotted-l.svg);
}

form {
  display: flex;
  flex-direction: column;
  gap: 20px;
  width: 500px;
  border: 1px solid #000;
  padding: 45px;
  background-color: #6dc1fd;
}

fieldset {
  display: grid;
  border: none;
  padding: 0;
}

label {
  display: block;
  font-weight: 800;
  font-size: 12px;
  text-transform: uppercase;
}

button {
  border: 1px solid #000;
  padding: 10px 65px;
  color: #000;
  font-family: inherit;
  font-weight: 800;
  font-size: inherit;
  text-transform: uppercase;
  background-color: #feafe8;
}

button:hover {
  box-shadow: inset 0 0 0 100px rgb(0 0 0 / 0.15);
  cursor: pointer;
}

button:focus {
  outline: 2px solid #000;
  outline-offset: 0;
}

.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  clip-path: inset(50%);
  white-space: nowrap;
}
</style></head>
  <body>
    <form>
      <fieldset>
        <label>
          <input class="visually-hidden" type="radio" name="answer">
          Да
        </label>
        <label>
          <input class="visually-hidden" type="radio" name="answer">
          Нет
        </label>
        <label>
          <input class="visually-hidden" type="radio" name="answer">
          Не знаю
        </label>
      </fieldset>
      <fieldset>
        <label>
          <input class="visually-hidden" type="checkbox" name="tv-show">
          Новости
        </label>
        <label>
          <input class="visually-hidden" type="checkbox" name="tv-show">
          Фантастика
        </label>
        <label>
          <input class="visually-hidden" type="checkbox" name="tv-show">
          Мультики
        </label>
      </fieldset>
      <fieldset>
        <select name="cartoon">
          <option value="">История игрушек</option>
          <option value="">Мулан</option>
          <option value="">Король Лев</option>
        </select>
      </fieldset>
      <button>Ответить</button>
    </form>
  

</body></html>
