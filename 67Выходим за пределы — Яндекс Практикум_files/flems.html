<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>За пределами допустимого</title>
    <link rel="stylesheet" href="./fonts.css">
    <link rel="stylesheet" href="./style.css">
  <style id="styles/style.css">* {
  box-sizing: border-box;
}

html,
body {
  height: 100%;
}

body {
  display: grid;
  justify-content: center;
  align-items: center;
  font-family: 'Open Sans', sans-serif;
  font-size: 18px;
  background-image: url(https://code.s3.yandex.net/web-code/images/dotted.svg);
}

form {
  display: grid;
  gap: 15px;
  border: 1px solid #000;
  padding: 35px;
  background-color: #fff;
}

label {
  display: grid;
  justify-content: center;
  gap: 5px;
}

label span {
  font-weight: 800;
  font-size: 16px;
  text-transform: uppercase;
}

input {
  border: 1px solid #000;
  padding: 10px 15px;
  font-family: inherit;
  font-size: inherit;
  background-color: transparent;
}

input:focus {
  outline: 2px solid #000;
  outline-offset: 0;
}

input[type='number']:out-of-range {
  background-color: #fd24af;
}

input[type='number']:in-range {
  background-color: #80d994;
}

button {
  border: 1px solid #000;
  padding: 10px 35px;
  color: #000;
  font-family: inherit;
  font-weight: 800;
  font-size: inherit;
  text-transform: uppercase;
  background-color: transparent;
}

button:hover {
  box-shadow: inset 0 0 0 100px rgb(0 0 0 / 0.15);
  cursor: pointer;
}

button:focus {
  outline: 2px solid #000;
  outline-offset: 0;
}
</style></head>
  <body>
    <form>
      <label>
        <span>Ведите число от 0 до 10</span>
        <input type="number" min="0" max="10" value="5">
      </label>
      <button>Проверить</button>
    </form>
  

</body></html>
