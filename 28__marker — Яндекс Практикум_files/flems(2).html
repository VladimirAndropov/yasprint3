<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список с ::marker</title>
    <link rel="stylesheet" href="./fonts.css">
    <link rel="stylesheet" href="./style(2).css">
  <style id="styles/style.css">body {
  display: flex;
  justify-content: center;
  align-items: center;
  min-width: 850px;
  min-height: 100vh;
  margin: 0;
  font-family: 'Open Sans', sans-serif;
  font-size: 1.2em;
  background-image: url(https://code.s3.yandex.net/web-code/images/dotted-l.svg);
}

div {
  border: 1px solid #000;
  padding: 50px;
  background-color: #fff;
}

h1 {
  margin-top: 0;
}

ol {
  margin: 0;
  padding: 0;
  list-style-position: inside;
  list-style-type: decimal-leading-zero;
}

/* Тут будут стили для маркера */

li::marker {
  color: #23054a;
  font-weight: bold;
  font-size: 2rem;
}
</style></head>
  <body>
    <div>
      <h1 class="title">Мы самые классные!</h1>
      <p class="description">И вот почему:</p>
      <ol class="list">
        <li class="list-item">Мы верим в добро.</li>
        <li class="list-item">Мы умеем дружить.</li>
        <li class="list-item">Мы меняем мир к лучшему.</li>
      </ol>
    </div>
  

</body></html>
