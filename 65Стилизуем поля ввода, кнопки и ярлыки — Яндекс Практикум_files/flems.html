  <style id="styles/style.css">* {

}

html,
body {
  height: 100%;
}

  align-items: flex-start;
  min-width: 650px;
  margin: 0;
  font-family: 'Open Sans', sans-serif;
  font-size: 18px;
  background-image: url(https://code.s3.yandex.net/web-code/images/dotted.svg);
}

form {

  margin-top: 100px;
  border: 1px solid #000;
  padding: 35px;
  background-color: #fff;
}

}

  margin-bottom: 0;
}

}
