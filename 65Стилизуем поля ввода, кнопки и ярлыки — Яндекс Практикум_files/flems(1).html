  <style id="styles/style.css">* {

html,
body {

}

  justify-content: center;
  align-items: center;
  min-width: 650px;
  margin: 0;
  font-family: 'Open Sans', sans-serif;
  font-size: 18px;
  background-image: url(https://code.s3.yandex.net/web-code/images/dotted.svg);
}

form {
  width: 600px;
  border: 1px solid #000;
  padding: 35px;
  background-color: #fff;
}

input {
  width: 100%;
}

input:focus {
  outline-color: #ffc802; /* цвет обводки — жёлтый */
  outline-style: dashed; /* стиль линии — прерывистая */

}
