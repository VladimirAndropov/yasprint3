<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Стилизуем поля ввода</title>
    <link rel="stylesheet" href="./fonts.css">
    <link rel="stylesheet" href="./style(2).css">
  <style id="styles/style.css">* {
  box-sizing: border-box;
}

html,
body {
  height: 100%;
}

body {
  display: flex;
  justify-content: center;
  align-items: center;
  min-width: 650px;
  font-family: 'Open Sans', sans-serif;
  font-size: 18px;
  background-image: url(https://code.s3.yandex.net/web-code/images/dotted.svg);
}

form {
  display: grid;
  gap: 20px;
  width: 600px;
  padding: 35px;
  background-color: #80d994;
}

label,
input {
  width: 100%;
}

label span {
  display: block;
  margin-bottom: 5px;
  font-weight: 800;
  font-size: 12px;
  text-transform: uppercase;
}

button {
  border: 1px solid #000;
  padding: 10px 65px;
  color: #000;
  font-family: inherit;
  font-weight: 800;
  font-size: inherit;
  text-transform: uppercase;
  background-color: #ffc802;
}

button:hover {
  box-shadow: inset 0 0 0 100px rgb(0 0 0 / 0.15);
  cursor: pointer;
}

button:focus {
  outline: 2px solid #000;
  outline-offset: 0;
}

button[disabled] {
  opacity: 0.6;
}

input {
  /* Тут сбрасываем белый фон */
}
</style></head>
  <body>
    <form>
      <label>
        <span>Введите ваше имя</span>
        <input type="text">
      </label>
      <label>
        <span>Введите почту</span>
        <input type="email">
      </label>
      <button>Отправить форму</button>
    </form>
  

</body></html>
