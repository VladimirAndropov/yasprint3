<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поля формы</title>
    <link rel="stylesheet" href="./fonts.css">
    <link rel="stylesheet" href="./style.css">
  <style id="styles/style.css">* {
  box-sizing: border-box;
}

body {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  margin: 0;
  font-family: 'Open Sans', sans-serif;
  background-image: url(https://code.s3.yandex.net/web-code/images/dotted-l.svg);
}

button {
  display: block;
  border: 1px solid #000;
  padding: 10px 65px;
  color: #000;
  font-family: inherit;
  font-weight: 800;
  font-size: inherit;
  text-transform: uppercase;
  background-color: #ffc802;
}

button:hover {
  box-shadow: inset 0 0 0 100px rgb(0 0 0 / 0.15);
  cursor: pointer;
}

button:focus {
  outline: 2px solid #000;
  outline-offset: 0;
}

label {
  display: block;
  margin: 0;
  margin-bottom: 5px;
  font-weight: 800;
  font-size: 12px;
  text-transform: uppercase;
}

input:not([type=checkbox]) {
  display: block;
  margin-bottom: 20px;
  border: 1px solid #000;
  padding: 10px 15px;
  font-family: inherit;
  font-size: inherit;
  background-color: transparent;
}

input:not([type=checkbox]):last-of-type {
  margin-bottom: 0;
}

input:not([type=checkbox])::placeholder {
  color: rgb(0 0 0 / 0.6);
}

input:not([type=checkbox]):focus {
  outline: 2px solid #000;
  outline-offset: 0;
}

input[type=checkbox] {
  width: 27px;
  height: 27px;
  margin: 0;
  accent-color: #000;
}

input[type=checkbox]:focus {
  outline: 2px solid #000;
  outline-offset: 0;
}

input[type=checkbox] {
  width: 27px;
  height: 27px;
  margin: 0;
  accent-color: #000;
}

input[type=checkbox]:focus {
  outline: 2px solid #000;
  outline-offset: 0;
}

form {
  display: flex;
  flex-direction: column;
  border: 1px solid #000;
  padding: 45px;
  background-color: #80d994;
}

.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  border: 0;
  padding: 0;
  overflow: hidden;

  /* clip: rect(0 0 0 0); */
  clip-path: inset(0, 0, 0, 0);
}
</style></head>
  <body>
    <form action="https://sandbox.practicum-team.ru/tasks/02-interactivity-and-accessibility/06-forms-html/13-virtual-keyboard/example-01/pre/flems.html">
      <label for="inputmode-text">inputmode=text</label>
      <input type="text" inputmode="text" id="inputmode-text">
      <label for="inputmode-numeric">inputmode=numeric</label>
      <input type="text" inputmode="numeric" id="inputmode-numeric">
      <label for="inputmode-decimal">inputmode=decimal</label>
      <input type="text" inputmode="decimal" id="inputmode-decimal">
      <label for="inputmode-email">inputmode=email</label>
      <input type="text" inputmode="email" id="inputmode-email">
      <label for="inputmode-tel">inputmode=tel</label>
      <input type="text" inputmode="tel" id="inputmode-tel">
      <label for="inputmode-url">inputmode=url</label>
      <input type="text" inputmode="url" id="inputmode-url">
      <label for="inputmode-search">inputmode=search</label>
      <input type="text" inputmode="search" id="inputmode-search">
    </form>
  

</body></html>
