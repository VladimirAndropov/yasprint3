<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поля формы</title>
    <link rel="stylesheet" href="./fonts.css">
    <link rel="stylesheet" href="./style.css">
  <style id="styles/style.css">* {
  box-sizing: border-box;
}

body {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  margin: 0;
  font-family: 'Open Sans', sans-serif;
  background-image: url(https://code.s3.yandex.net/web-code/images/dotted-l.svg);
}

input:not(:last-child) {
  margin-bottom: 20px;
}

input:not([type=checkbox]) {
  display: block;
  margin-bottom: 20px;
  border: 1px solid #000;
  padding: 10px 15px;
  font-family: inherit;
  font-size: inherit;
  background-color: transparent;
}

input:not([type=checkbox])::placeholder {
  color: rgb(0 0 0 / 0.6);
}

input:not([type=checkbox]):focus {
  outline: 2px solid #000;
  outline-offset: 0;
}

input[type=checkbox] {
  width: 27px;
  height: 27px;
  margin: 0;
  accent-color: #000;
}

input[type=checkbox]:focus {
  outline: 2px solid #000;
  outline-offset: 0;
}

input[type=button] {
  display: block;
  width: 100%;
  border: 1px solid #000;
  padding: 10px 65px;
  color: #000;
  font-family: inherit;
  font-weight: 800;
  font-size: inherit;
  text-transform: uppercase;
  background-color: #ffc802;
}

input[type=button]:hover {
  box-shadow: inset 0 0 0 100px rgb(0 0 0 / 0.15);
  cursor: pointer;
}

input[type=button]:focus {
  outline: 2px solid #000;
  outline-offset: 0;
}

form {
  border: 1px solid #000;
  padding: 45px;
  background-color: #80d994;
}

.agree {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 20px;
}

.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  border: 0;
  padding: 0;
  overflow: hidden;

  /* clip: rect(0 0 0 0); */
  clip-path: inset(0, 0, 0, 0);
}
</style></head>
  <body>
    <form>
      <label for="email" class="visually-hidden">Почта</label>
      <input type="email" placeholder="me@example.com" id="email">
      <label for="password" class="visually-hidden">Пароль</label>
      <input type="password" placeholder="Пароль" id="password">
      <label class="agree"><input type="checkbox"> Запомнить меня</label>
      <input class="button" type="button" value="Войти">
    </form>
  

</body></html>
