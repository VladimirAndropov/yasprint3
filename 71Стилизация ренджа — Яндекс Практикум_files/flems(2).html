<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Красивый рендж</title>
    <link rel="stylesheet" href="./fonts.css">
    <link rel="stylesheet" href="./style(2).css">
  <style id="styles/style.css">* {
  box-sizing: border-box;
}

html,
body {
  height: 100%;
}

body {
  display: grid;
  justify-content: center;
  align-items: center;
  min-width: 500px;
  margin: 0;
  font-family: 'Open Sans', sans-serif;
  font-size: 18px;
  background-color: #feafe8;
}

form {
  width: 400px;
  border: 2px solid #000;
  padding: 50px;
}

label {
  display: block;
}

label span {
  display: block;
  font-weight: 800;
  font-size: 12px;
  text-transform: uppercase;
}

input[type='range'] {
  width: 100%;
  background-color: transparent;
  -webkit-appearance: none;
  -moz-appearance: none;
  appearance: none;
}
</style></head>
  <body>
    <form>
      <label>
        <span> Громкость крика </span>
        <input type="range" min="0" max="100" step="20" value="40">
      </label>
    </form>
  

</body></html>
