  <style id="styles/style.css">*,
*::before,

body {
  display: flex;
  justify-content: center;
  align-items: center;
  min-width: 850px;
  min-height: 100vh;
  margin: auto;
  font-family: 'Open Sans', sans-serif;
  background-image: url(https://code.s3.yandex.net/web-code/images/dotted-l.svg);
}

h1,
h2,
p,
blockquote {
  margin: 0;
}

.cards {
  display: flex;
  gap: 40px;
}

.card {
  width: 300px;
  border: 1px solid #000;
  overflow: hidden;
  background-color: #fff;
}

.card__image-wrapper {
  position: relative;
  padding-bottom: 100%;
}

.dalai-lama-photo {
  background-image: url(./images/dalai-lama.jpg);
  background-position: center;
  background-size: cover;
}

.card__image {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
}

.card__description {
  position: absolute;
  right: 8px;
  bottom: 8px;
  color: #fff;
  text-align: right;
}

.photo-copyright {
  font-size: 12px;
}

.card__quote {
  padding: 16px;
  font-size: 20px;
