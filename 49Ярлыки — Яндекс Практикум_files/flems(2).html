  <style id="styles/style.css">* {
  box-sizing: border-box;
}

body {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  margin: 0;
  font-family: 'Open Sans', sans-serif;
  background-image: url(https://code.s3.yandex.net/web-code/images/dotted-l.svg);
}

button {
  display: block;
  border: 1px solid #000;
  padding: 10px 65px;
  color: #000;
  font-family: inherit;
  font-weight: 800;
  font-size: inherit;
  text-transform: uppercase;
  background-color: #ffc802;
}

button:hover {
  box-shadow: inset 0 0 0 100px rgb(0 0 0 / 0.15);
  cursor: pointer;
}

button:focus {
  outline: 2px solid #000;
  outline-offset: 0;
}

label {
  display: block;
  font-weight: 800;
  font-size: 12px;
  text-transform: uppercase;
}

label:first-of-type {
  margin-bottom: 20px;
}

input {
  display: block;
  width: 100%;
  margin-top: 5px;
  border: 1px solid #000;
  padding: 10px 15px;
  font-family: inherit;
  font-size: 16px;
  background-color: transparent;
}

input::placeholder {
  color: rgb(0 0 0 / 0.6);
}

input:focus {
  outline: 2px solid #000;
  outline-offset: 0;
}

form {
  border: 1px solid #000;
  padding: 45px;
  background-color: #80d994;
}

.agree {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 20px;
}

.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  border: 0;
  padding: 0;
  overflow: hidden;

  /* clip: rect(0 0 0 0); */
  clip-path: inset(0, 0, 0, 0);
}
</style></head>
  <body>
    <form action="https://sandbox.practicum-team.ru/tasks/02-interactivity-and-accessibility/06-forms-html/07-labels/example-03/pre/flems.html">
      <!-- вот так не сработает -->
      <label for="first-name">
        Имя
        <input type="text">
      </label>
      <!-- А вот так сработает -->
      <label for="last-name">Фамилия</label>
      <input type="text" id="last-name">
    </form>
  

</body></html>
