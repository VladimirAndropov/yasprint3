<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

    <title>Menu</title>
    <link rel="stylesheet" href="./fonts.css">
    <link rel="stylesheet" href="./style(3).css">
  <style id="styles/style.css">*,
*::before,
*::after {
  box-sizing: border-box;
}

body {
  min-width: 850px;
  margin: 0;
  font-family: 'Open Sans', sans-serif;
}

.header {
  position: relative;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px 40px;
  background-color: #fd24af;
}

.logo-link {
  width: 200px;
}

.header__menu-button {
  width: 40px;
  height: 40px;
  border: none;
  background-color: transparent;
  background-image: url(./images/hamburger-menu.svg);
  background-repeat: no-repeat;
  background-position: center;
  background-size: contain;
  cursor: pointer;
}

.header__menu-button:hover {
  opacity: 0.8;
}

.menu {
  position: absolute;
  bottom: 0;
  left: 0;
  display: none;
  width: 100%;
  border: 1px solid #000;
  border-top: 1px solid #000;
  padding: 40px;
  background-color: #fff;
  transform: translateY(100%);
}

.menu ul {
  display: flex;
  justify-content: center;
  font-size: 24px;
  list-style: none;
}

.menu a {
  border: 1px solid #000;
  padding: 10px 35px;
  color: #000;
  font-weight: 800;
  text-decoration: none;
  text-transform: uppercase;
  background-color: #ffc802;
}

.menu a:hover {
  text-decoration: underline;
}

.visually-hidden {
  position: absolute; /* элемент вырывают из потока */
  width: 1px; /* делают элемент очень маленьким, но таким, чтобы не пропал совсем */
  height: 1px;
  margin: -1px; /* элемент убираю из поля зрения, сдвинув на размер самого себя */
  border: 0; /* убирают границу, она тоже может быть у каких-то элементов */
  padding: 0; /* обнуляют отступы, они есть у некоторых элементов по умолчанию */
  overflow: hidden; /* на всякий случай скрывают видимое за пределами блока */
  clip: rect(0 0 0 0); /* это свойство образает видимую область до нулевого значения */
}
</style></head>
  <body>
    <header class="header" role="banner">
      <a class="logo-link">
        <img src="./logo(1).svg" alt="Логотип vёрстка">
      </a>
      <button class="header__menu-button">
        <span class="visually-hidden">Открыть меню</span>
      </button>
      <nav role="menu" class="menu">
        <ul>
          <li><a href="https://sandbox.practicum-team.ru/tasks/02-interactivity-and-accessibility/05-accesibility/08-aria/example-05/pre/flems.html#0">HTML</a></li>
          <li><a href="https://sandbox.practicum-team.ru/tasks/02-interactivity-and-accessibility/05-accesibility/08-aria/example-05/pre/flems.html#0">CSS</a></li>
          <li><a href="https://sandbox.practicum-team.ru/tasks/02-interactivity-and-accessibility/05-accesibility/08-aria/example-05/pre/flems.html#0">JS</a></li>
        </ul>
      </nav>
    </header>
    <script charset="utf-8" src="./script(2).js.загрузка"></script>
  

</body></html>
